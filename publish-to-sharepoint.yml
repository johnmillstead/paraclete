name: Publish Website to SharePoint

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node (Astro-friendly)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Astro site
      - name: Build website
        run: npm run build

      # ------------------------------------------------------------------
      # 5. Publish BUILD output → SharePoint "Website Preview"
      # ------------------------------------------------------------------
      - name: Publish Website Preview to SharePoint
        uses: obrassard/action-sharepoint-publish@v1.1.1
        with:
          site_url: https://paracletemg.sharepoint.com/sites/InformationTechnology
          library_folder: 'Website - In Progress/Website Preview'
          local_folder: 'build'
          sharepoint_client_id: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          sharepoint_client_secret: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}

      # ------------------------------------------------------------------
      # 6. Publish DOCS → SharePoint "Website Documentation"
      # ------------------------------------------------------------------
      - name: Publish Website Docs to SharePoint
        uses: obrassard/action-sharepoint-publish@v1.1.1
        with:
          site_url: https://paracletemg.sharepoint.com/sites/InformationTechnology
          library_folder: 'Website - In Progress/Website Documentation'
          local_folder: 'docs'
          sharepoint_client_id: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          sharepoint_client_secret: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
