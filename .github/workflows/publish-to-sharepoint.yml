name: Publish Website to SharePoint

# Opt into Node 24 for all JavaScript-based actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (Astro requires >=22.12; Node 24 is recommended)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the Astro site (outputs to dist/)
      - name: Build site
        run: npm run build

      # 5. Sync build output to SharePoint (folder-aware)
      - name: Publish Website Preview to SharePoint
        uses: MarkusMcNugen/SharePoint-Mirror-Sync@v1.0.0
        with:
          
          # Match all files under dist/
              file_path: dist/**
              file_path_recursive_match: true
          
              # SharePoint tenant host (no https://)
              host_name: paracletemg.sharepoint.com
          
              # Site name (not full URL)
              site_name: InformationTechnology
          
              # Destination folder inside the document library
              upload_path: "/Website_in_Progress/WebsitePreview"
          
              # Entra app credentials
              tenant_id: ${{ secrets.SHAREPOINT_TENANT_ID }}
              client_id: ${{ secrets.SHAREPOINT_CLIENT_ID }}
              client_secret: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
