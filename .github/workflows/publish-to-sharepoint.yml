name: Publish Website to SharePoint

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - name: Publish Website Preview
        
  uses: MarkusMcNugen/SharePoint-Mirror-Sync@v1.0.0
  with:
    host_name: paracletemg.sharepoint.com
    site_name: InformationTechnology
    upload_path: "Website - In Progress/Website Preview"
    file_path: dist
    tenant_id: ${{ secrets.SHAREPOINT_TENANT_ID }}
    client_id: ${{ secrets.SHAREPOINT_CLIENT_ID }}
    client_secret: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}


