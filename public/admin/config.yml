# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: johnmillstead/paraclete
  branch: main
  auth_scope: repo

media_folder: public/media
public_folder: /media

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Date,
          name: date,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - label: Author
        name: author
        widget: relation
        collection: authors
        search_fields: [title]
        value_field: slug
        display_fields: [title]
        required: true
      - { label: Body, name: body, widget: richtext }

  - name: authors
    label: Authors
    label_singular: Author
    folder: src/content/authors
    create: true
    slug: "{{slug}}"
    fields:
      - label: Name
        name: title
        widget: string

      - label: Profile Image
        name: image
        widget: image
        required: true
        media_folder: images
        public_folder: images

      - label: Bio
        name: body
        widget: richtext

  - name: ministries
    label: Ministries
    folder: src/content/ministries
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: richtext }

  - name: staff
    label: Staff
    folder: src/content/staff
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{order}} - {{name}} - {{title}}"
    sortable_fields: [order, name, title, active, draft]
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Title, name: title, widget: string }

      # ---------- Visibility / workflow ----------
      - {
          label: "Draft",
          name: "draft",
          widget: "boolean",
          default: false,
          required: true,
        }
      - {
          label: "Active",
          name: "active",
          widget: "boolean",
          default: true,
          required: true,
        }
      - {
          label: "Order",
          name: "order",
          widget: "number",
          value_type: "int",
          min: 0,
          default: 0,
        }

      # ---------- Photo ----------
      # IMPORTANT: Your seeded staff currently uses ABSOLUTE image URLs (R2).
      # If you want to KEEP that, use widget: string.
      - label: "Photo (URL)"
        name: "photo"
        widget: "string"
        required: false
        hint: "Use a full URL (https://...). If you prefer uploading images via CMS, we can switch this field to widget: image."

      # If instead you want CMS-managed uploads, replace the field above with:
      # - { label: "Photo", name: "photo", widget: "image", required: false }

      # ---------- Bio ----------
      - { label: "Bio", name: "bio", widget: "markdown", required: false }

  - name: board
    label: Board
    folder: src/content/board
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Name, name: title, widget: string }
      - { label: Bio, name: body, widget: richtext }

  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: richtext }

  - name: resources
    label: Resources
    folder: src/content/resources
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: richtext }
